name: Privacy Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files and network examples
        run: |
          python3 tests/privacy_check_test.py
          python3 scripts/check-sensitive-files.py
      - name: Download checksum-pinned Gitleaks
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the committed snapshot without exposing suspected secrets
        run: |
          snapshot=$(mktemp -d)
          git archive HEAD | tar -x -C "$snapshot"
          /tmp/gitleaks dir --redact=100 --no-banner "$snapshot"
